name: Windows alpha release
on:
  push:
    branches: [release/v0.1.0-alpha.1]
  workflow_dispatch:

jobs:
  package:
    if: github.ref == 'refs/heads/release/v0.1.0-alpha.1'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: v0.1.0-alpha.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Test
        run: dotnet run -c Release --project tests/SaReGaMidi.Recognition.Tests
      - name: Package Windows x64
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'SaReGaMidi'
          dotnet publish src/SaReGaMidi.UI -c Release -r win-x64 --self-contained true -o $folder
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($file in 'SaReGaMidi.UI.exe','coreclr.dll','PresentationFramework.dll','tesseract55.dll','leptonica-1.87.0.dll','tessdata/hin.traineddata','tessdata/LICENSE','licenses/tesseract.txt') {
            if (!(Test-Path (Join-Path $folder $file))) { throw "Package is missing $file" }
          }
          Copy-Item "docs/release-notes/$env:TAG.md" "$folder/README.md"
          $zip = "SaReGaMidi-$env:TAG-win-x64-self-contained.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $zip
          (Get-FileHash $zip).Hash.ToLowerInvariant() + "  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG "SaReGaMidi-$env:TAG-win-x64-self-contained.zip" SHA256SUMS.txt --target $env:GITHUB_SHA --title "SaReGaMidi 0.1.0 Alpha 1" --notes-file "docs/release-notes/$env:TAG.md" --prerelease
